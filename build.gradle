plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

def webstormHome = findProperty('ideaLocalPath') ?: '/Applications/WebStorm.app/Contents'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    intellijPlatform {
        local(webstormHome)
        bundledPlugins('Git4Idea', 'org.jetbrains.plugins.github', 'com.intellij.tasks')
        bundledModule('intellij.platform.debugger')
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }

    implementation("org.jodd:jodd-core:${joddVersion}")
    implementation("org.apache.commons:commons-lang3:${commonsLang3Version}")
    implementation("org.yaml:snakeyaml:${snakeYamlVersion}")
    implementation("io.dropwizard.metrics:metrics-core:${metricsVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation("io.dropwizard.metrics:metrics-jmx:${metricsVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation("com.hrakaroo:glob:${globVersion}")

    testImplementation("org.eclipse.jgit:org.eclipse.jgit:${jgitVersion}")
    testImplementation("org.mockito:mockito-core:${mockitoVersion}")
    testImplementation("org.mockito:mockito-junit-jupiter:${mockitoVersion}")
    testImplementation("io.mockk:mockk:${mockkVersion}")
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testImplementation 'junit:junit:4.13.2'
    testImplementation("org.assertj:assertj-core:${assertjCoreVersion}")
    testImplementation("org.slf4j:slf4j-api:${slf4jVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

intellijPlatform {
    buildSearchableOptions = false
    pluginVerification {
        ides {
            local(webstormHome)
        }
    }
    pluginConfiguration {
        changeNotes = file('change-notes.html').getText('UTF-8')
        description = file('description.html').getText('UTF-8')
            .replace('RELEASE_DATETIME', new Date().format('yyyyMMdd.HHmmss', TimeZone.getTimeZone('UTC')))
            .replace('RELEASE_TYPE', 'EAP')
        ideaVersion {
            sinceBuild = '263'
            untilBuild = provider { null }
        }
    }
}

tasks.withType(Test).configureEach {
    // platform classes are newer than the ByteBuddy bundled with Mockito
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.test {
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
        exclude('zielu/junit5/**')
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
        exclude('zielu/junit5/**')
        includeTags 'integration'
    }
}
